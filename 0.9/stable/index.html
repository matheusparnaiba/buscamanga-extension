<!doctype html>
<html lang="pt-br">
  <head>
    <meta name="robots" content="noindex" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="buscamanga.ico" type="image/x-icon" />
    <title>BuscaMangá</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
  </head>

  <body
    class="bg-slate-900 text-slate-200 font-[Inter] p-4 md:p-8 lg:p-12 text-center"
    x-data="repositoryData()"
    x-init="await initialize()"
  >
    <div class="container mx-auto max-w-7xl">
      <header class="flex flex-col items-center relative mt-4">
        <div
          class="absolute w-28 h-28 md:w-40 md:h-40 -top-4 left-1/2 -translate-x-1/2 rounded-full"
          style="
            background:
              radial-gradient(
                circle at 30% 30%,
                rgba(56, 189, 248, 0.4) 0%,
                transparent 70%
              ),
              radial-gradient(
                circle at 70% 70%,
                rgba(59, 130, 246, 0.4) 0%,
                transparent 70%
              );
            filter: blur(25px);
          "
        ></div>
        <div class="relative z-10">
          <img
            class="md:max-h-32 max-h-20 rounded-lg shadow-lg"
            src="logo.png"
            alt="Logo do Repositório"
          />
        </div>

        <h1
          x-show="repository"
          x-text="repository?.name"
          class="text-xl mt-4 md:text-4xl font-bold text-white drop-shadow-md"
        ></h1>

        <p
          x-show="repository"
          x-text="repository?.description"
          class="mt-4 text-center text-slate-400"
        ></p>

        <a
          class="addToPaperbackButton inline-block leading-7 mt-6 mx-1 py-3 px-6 text-white font-medium bg-blue-600 border-b-4 border-blue-800 rounded-full transition-all duration-200 hover:bg-blue-500 hover:-translate-y-1 hover:shadow-[0_0_15px_rgba(59,130,246,0.5)] hover:cursor-pointer"
          @click="addToPaperback()"
          x-show="repository"
        >
          Adicionar ao Paperback
        </a>
      </header>

      <div class="mx-auto text-left mt-8">
        <!-- Error message -->
        <div
          x-show="error"
          class="bg-red-500/20 border border-red-500 text-white p-4 rounded-xl mt-6 text-center"
        >
          <p class="font-bold text-red-400">Erro ao carregar dados do repositório</p>
          <p x-text="error" class="mt-2"></p>
          <button
            @click="initialize()"
            class="mt-4 bg-red-500 text-white px-6 py-2 font-medium rounded-lg hover:bg-red-400 transition"
          >
            Tentar Novamente
          </button>
        </div>

        <div class="mt-6 space-y-4" x-show="!error">
          <div x-show="repository" class="relative">
            <label
              for="source-search"
              class="block text-sm font-semibold tracking-wide text-slate-400 mb-2 uppercase"
            >
              Buscar
            </label>
            <input
              type="text"
              id="source-search"
              x-model="searchTerm"
              placeholder="Buscar fontes..."
              class="w-full px-5 py-3 bg-slate-800/80 border border-slate-700 rounded-xl text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all shadow-inner"
            />
          </div>

          <!-- Badge filters -->
          <div x-show="repository" class="relative mt-4">
            <div class="overflow-x-auto" x-show="availableBadges.length">
              <label
                id="badge-filter-label"
                class="block text-sm font-semibold tracking-wide text-slate-400 mb-2 uppercase"
              >
                Filtrar
              </label>
              <div
                class="inline-flex gap-2 pb-2"
                role="group"
                aria-labelledby="badge-filter-label"
              >
                <template x-for="badge in availableBadges" :key="badge.label">
                  <button
                    @click="toggleBadgeFilter(badge)"
                    class="px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200 shrink-0 hover:cursor-pointer shadow-sm"
                    :style="selectedBadges.some(b => b.label === badge.label) ?
                            `background-color: ${badge.backgroundColor}; color: ${badge.textColor};` :
                            `background-color: ${badge.backgroundColor + '20'}; color: ${badge.backgroundColor}; border: 1px solid ${badge.backgroundColor}40;`"
                    x-text="badge.label"
                  ></button>
                </template>
              </div>
            </div>
          </div>

          <!-- Sort controls -->
          <div
            x-show="repository"
            class="flex justify-between items-center flex-wrap gap-3 mt-8 mb-4"
          >
            <div>
              <p class="text-xl font-bold text-white drop-shadow-sm">Fontes Disponíveis:</p>
              <p class="text-sm text-slate-400 mt-1">
                Clique nas fontes para selecioná-las para instalação
              </p>
            </div>
          </div>

          <div
            x-show="repository"
            class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"
          >
            <template x-for="source in filteredSources" :key="source.id">
              <div
                @click="toggleSource(source.id)"
                class="bg-slate-800/60 backdrop-blur-sm border border-slate-700/50 rounded-2xl shadow-xl overflow-hidden hover:cursor-pointer hover:-translate-y-1 hover:shadow-blue-900/20 transition-all duration-300 relative group"
                :class="selectedSources.has(source.id) ? 'ring-2 ring-blue-500 bg-slate-800/90' : ''"
                @keydown.enter="toggleSource(source.id)"
                tabindex="0"
              >
                <!-- Desktop Layout -->
                <div class="hidden md:block">
                  <div class="p-5 flex items-center justify-between">
                    <div class="flex items-center space-x-4">
                      <img
                        :src="`${baseUrl}/${source.id}/static/${source.icon}`"
                        :alt="`Ícone de ${source.name}`"
                        class="w-14 h-14 rounded-xl shadow-md object-cover bg-white p-1"
                        loading="lazy"
                        onerror="
                          this.src = 'logo.png'
                          this.onerror = ''
                        "
                      />
                      <h3
                        class="text-xl font-bold text-white"
                        x-text="source.name"
                      ></h3>
                    </div>
                    <span
                      class="px-2 py-1 rounded text-xs font-bold tracking-wider"
                      :class="getContentRatingClass(source.contentRating)"
                      x-text="source.contentRating"
                    ></span>
                  </div>
                  <div class="p-5 border-t border-slate-700/50">
                    <p class="text-slate-400 text-xs font-semibold tracking-wider mb-2 uppercase">
                      Versão: <span class="text-slate-200" x-text="source.version"></span>
                    </p>
                    <p
                      class="text-slate-300 text-sm mb-4 line-clamp-2 min-h-[2.5rem] leading-relaxed"
                      x-text="source.description"
                    ></p>
                  </div>
                  <div class="p-5 pt-0">
                    <div
                      class="flex flex-nowrap gap-2 overflow-x-auto pb-2"
                      x-show="source.badges && source.badges.length"
                    >
                      <template
                         x-for="badge in sortBadges(source.badges)"
                        :key="badge.label"
                      >
                        <span
                          class="px-2.5 py-1 rounded-md text-xs font-semibold whitespace-nowrap shrink-0 transition-all duration-200"
                          :style="selectedBadges.some(b => b.label === badge.label) ?
                                  `background-color: ${badge.backgroundColor}; color: ${badge.textColor};` :
                                  `background-color: ${badge.backgroundColor + '30'}; color: ${badge.textColor};`"
                          x-text="badge.label"
                        ></span>
                      </template>
                    </div>
                    <div class="text-slate-400 text-sm flex items-center mt-3">
                      <span
                        x-show="selectedSources.has(source.id)"
                        class="text-blue-400 text-xs font-semibold flex items-center gap-1"
                      >
                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>
                        Selecionada
                      </span>
                    </div>
                  </div>
                </div>
                <!-- Mobile Layout -->
                <div class="md:hidden p-5">
                  <div class="flex items-start justify-between mb-2">
                    <div class="flex items-center space-x-4">
                      <img
                        :src="`${baseUrl}/${source.id}/static/${source.icon}`"
                        :alt="`Ícone de ${source.name}`"
                        class="w-14 h-14 rounded-xl shadow-md object-cover bg-white p-1"
                        loading="lazy"
                        onerror="
                          this.src = 'logo.png'
                          this.onerror = ''
                        "
                      />
                      <div class="flex flex-col space-y-1">
                        <h3
                          class="text-lg font-bold text-white leading-tight"
                          x-text="source.name"
                        ></h3>
                        <span
                          class="text-xs font-semibold text-slate-400 tracking-wider"
                          x-text="`v${source.version}`"
                        ></span>
                      </div>
                    </div>
                    <span
                      class="px-2 py-1 rounded text-[10px] font-bold tracking-wider shrink-0 uppercase"
                      :class="getContentRatingClass(source.contentRating)"
                      x-text="source.contentRating"
                    ></span>
                  </div>
                  <p
                    class="text-slate-300 text-sm mt-3 mb-4 line-clamp-2 min-h-[2.5rem] leading-relaxed"
                    x-text="source.description"
                  ></p>
                  <div class="mt-2">
                    <div
                      class="flex flex-nowrap gap-2 overflow-x-auto pb-2"
                      x-show="source.badges && source.badges.length"
                    >
                      <template
                        x-for="badge in sortBadges(source.badges)"
                        :key="badge.label"
                      >
                        <span
                          class="px-2.5 py-1 rounded-md text-xs font-semibold whitespace-nowrap shrink-0 transition-all duration-200"
                          :style="selectedBadges.some(b => b.label === badge.label) ?
                                  `background-color: ${badge.backgroundColor}; color: ${badge.textColor};` :
                                  `background-color: ${badge.backgroundColor + '30'}; color: ${badge.textColor};`"
                          x-text="badge.label"
                        ></span>
                      </template>
                    </div>
                    <span
                      x-show="selectedSources.has(source.id)"
                      class="text-blue-400 text-xs font-semibold flex items-center gap-1 mt-3"
                    >
                      <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>
                      Selecionada
                    </span>
                  </div>
                </div>
              </div>
            </template>
          </div>

          <!-- Empty state when no sources match filter -->
          <div
            x-show="repository && filteredSources.length === 0"
            class="p-12 text-center bg-slate-800/30 rounded-2xl border border-slate-700 border-dashed mt-6"
          >
            <svg class="w-12 h-12 mx-auto text-slate-600 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            <p class="text-lg text-slate-400 font-medium">
              Nenhuma fonte encontrada com os filtros atuais
            </p>
            <button
              @click="resetFilters()"
              class="mt-6 bg-slate-700 hover:bg-slate-600 text-white font-medium px-6 py-2 rounded-lg transition-colors"
            >
              Limpar Filtros
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Build Information Footer -->
    <footer
      class="mt-12 md:mt-20 text-center text-xs font-medium tracking-wide text-slate-500 uppercase border-t border-slate-800 pt-8 pb-12"
      x-show="buildInfo?.buildTime && buildInfo?.builtWith"
    >
      <div class="space-y-2 flex flex-col items-center justify-center opacity-60">
        <p>
          Paperback Toolchain:
          <span class="text-slate-400" x-text="buildInfo?.builtWith?.toolchain"></span>
        </p>
        <p>
          Paperback Types: <span class="text-slate-400" x-text="buildInfo?.builtWith?.types"></span>
        </p>
        <p>
          Última Atualização:
          <span class="text-slate-400"
            x-text="buildInfo?.buildTime ? new Date(buildInfo.buildTime).toLocaleString('pt-BR') : ''"
          >
          </span>
        </p>
      </div>
    </footer>

    <!-- Floating Install Button -->
    <div
      x-show="selectedSources.size > 0"
      class="fixed bottom-8 right-8 z-50"
      x-transition:enter="transition ease-out duration-300"
      x-transition:enter-start="opacity-0 translate-y-8 scale-90"
      x-transition:enter-end="opacity-100 translate-y-0 scale-100"
      x-transition:leave="transition ease-in duration-200"
      x-transition:leave-start="opacity-100 translate-y-0 scale-100"
      x-transition:leave-end="opacity-0 translate-y-8 scale-90"
    >
      <button
        @click="installSelectedSources()"
        class="py-3 px-6 bg-blue-600 text-white font-bold tracking-wide rounded-full hover:bg-blue-500 hover:scale-105 transition-all duration-200 shadow-[0_10px_25px_-5px_rgba(37,99,235,0.5)] flex items-center space-x-3"
      >
        <span>INSTALAR</span>
        <span
          class="bg-white text-blue-700 px-2.5 py-0.5 rounded-full text-sm font-black shadow-sm"
          x-text="selectedSources.size"
        ></span>
      </button>
    </div>
  </body>

  <script>
    document.addEventListener('alpine:init', () => {
      Alpine.data('repositoryData', () => ({
        baseUrl: window.location
          .toString()
          .replace('index.html', '')
          .replace(/\/$/, ''),
        repository: null,
        sources: [],
        selectedSources: new Set(),
        buildInfo: null,
        searchTerm: '',
        selectedBadges: [],
        availableBadges: [],
        error: null,

        get filteredSources() {
          return this.sources.filter((source) => {
            const matchesSearch =
              source.name
                .toLowerCase()
                .includes(this.searchTerm.toLowerCase()) ||
              source.description
                .toLowerCase()
                .includes(this.searchTerm.toLowerCase())

            const matchesBadges =
              this.selectedBadges.length === 0 ||
              this.selectedBadges.every((selectedBadge) =>
                source.badges?.some(
                  (badge) => badge.label === selectedBadge.label
                )
              )

            return matchesSearch && matchesBadges
          })
        },

        getCapabilityBadges(capabilities) {
          const badges = []
          const intents = {
            CHAPTER_PROVIDING: 1,
            PROGRESS_PROVIDING: 2,
            DISCOVER_SECTION_PROVIDING: 4,
            MANAGED_COLLECTION_PROVIDING: 8,
            CLOUDFLARE_BYPASS_PROVIDING: 16,
            SETTINGS_FORM_PROVIDING: 32,
            SEARCH_RESULT_PROVIDING: 64,
          }

          const capabilityLabels = {
            MANGA_CHAPTERS: {
              label: 'Conteúdo',
              textColor: '#FFFFFF',
              backgroundColor: '#3B82F6',
              type: 'capability',
            },
            MANGA_PROGRESS: {
              label: 'Tracker',
              textColor: '#FFFFFF',
              backgroundColor: '#10B981',
              type: 'capability',
            },
            COLLECTION_MANAGEMENT: {
              label: 'Coleções',
              textColor: '#FFFFFF',
              backgroundColor: '#F59E0B',
              type: 'capability',
            },
            CLOUDFLARE_BYPASS: {
              label: 'Cloudflare',
              textColor: '#FFFFFF',
              backgroundColor: '#EF4444',
              type: 'capability',
            },
          }

          const capabilityValues = Array.isArray(capabilities)
            ? capabilities
            : Object.entries(intents)
                .filter(([_, value]) => (capabilities & value) === value)
                .map(([_, value]) => value)

          for (const [key, value] of Object.entries(intents)) {
            if (capabilityValues.includes(value) && capabilityLabels[key]) {
              badges.push(capabilityLabels[key])
            }
          }

          return badges
        },

        async initialize() {
          try {
            this.error = null
            const response = await fetch(`${this.baseUrl}/versioning.json`)

            if (!response.ok) {
              throw new Error(
                `Falha ao carregar dados do servidor (${response.status})`
              )
            }

            const json = await response.json()
            this.repository = json.repository

            this.sources = json.sources.map((source) => ({
              ...source,
              badges: [
                ...this.getCapabilityBadges(source.capabilities),
                ...(source.badges || []),
              ],
            }))

            this.buildInfo = {
              buildTime: json.buildTime,
              builtWith: json.builtWith,
            }
            document.title = this.repository.name

            const badgeMap = new Map()
            this.sources.forEach((source) => {
              source.badges?.forEach((badge) => {
                if (!badgeMap.has(badge.label)) {
                  badgeMap.set(badge.label, badge)
                }
              })
            })
            this.availableBadges = Array.from(badgeMap.values())
          } catch (err) {
            console.error('Erro na inicialização:', err)
            this.error = err.message || 'Falha ao carregar repositório'
          }
        },

        resetFilters() {
          this.searchTerm = ''
          this.selectedBadges = []
        },

        toggleBadgeFilter(badge) {
          const index = this.selectedBadges.findIndex(
            (b) => b.label === badge.label
          )
          if (index === -1) {
            this.selectedBadges.push(badge)
          } else {
            this.selectedBadges.splice(index, 1)
          }
        },

        getContentRatingClass(rating) {
          const classes = {
            MATURE: 'bg-yellow-500/20 text-yellow-500 border border-yellow-500/30',
            ADULT: 'bg-red-500/20 text-red-500 border border-red-500/30',
            SAFE: 'bg-green-500/20 text-green-500 border border-green-500/30',
          }
          return classes[rating.toUpperCase()] || 'bg-slate-600/50 text-slate-300'
        },

        toggleSource(sourceId) {
          if (this.selectedSources.has(sourceId)) {
            this.selectedSources.delete(sourceId)
          } else {
            this.selectedSources.add(sourceId)
          }
        },

        installSelectedSources() {
          if (this.selectedSources.size === 0) {
            alert('Por favor, selecione pelo menos uma fonte.')
            return
          }
          const sourcesToInstall = Array.from(this.selectedSources).map(
            (id) => [id, this.baseUrl]
          )
          window.location.href = `paperback://installExtensions?data=${btoa(
            JSON.stringify(sourcesToInstall)
          )}`
        },

        addToPaperback() {
          if (!this.repository) {
            alert('Informações do repositório ainda não carregaram.')
            return
          }
          window.location.href = `paperback://addRepo?displayName=${encodeURI(
            this.repository.name
          )}&url=${encodeURI(this.baseUrl)}`
        },

        sortBadges(badges) {
          return [...badges].sort((a, b) => {
            const aSelected = this.selectedBadges.some(
              (s) => s.label === a.label
            )
            const bSelected = this.selectedBadges.some(
              (s) => s.label === b.label
            )
            return bSelected - aSelected
          })
        },
      }))
    })
  </script>
</html>
