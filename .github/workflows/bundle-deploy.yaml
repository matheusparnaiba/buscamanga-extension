name: Bundle and Deploy

on:
  push:
    branches:
      - "[0-9]+.[0-9]+/*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  bundle-deploy:
    name: Bundle and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Branch
        uses: actions/checkout@v6
      - name: Setup Node.js Environment
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install Dependencies
        run: npm install
      - name: Bundle Extensions
        run: npm run bundle
      - name: Customize Homepage
        run: |
          node -e "
            const fs = require('fs');
            fs.copyFileSync('assets/buscamanga.png', 'bundles/logo.png');
            fs.copyFileSync('assets/buscamanga.ico', 'bundles/buscamanga.ico');
            fs.copyFileSync('template.html', 'bundles/index.html');
            const folders = fs.readdirSync('src', { withFileTypes: true }).filter(dirent => dirent.isDirectory()).map(dirent => dirent.name);
            for (const folder of folders) {
              if (fs.existsSync('bundles/' + folder)) {
                if (fs.existsSync('src/' + folder + '/icon.png')) {
                  fs.copyFileSync('src/' + folder + '/icon.png', 'bundles/' + folder + '/icon.png');
                  if (!fs.existsSync('bundles/' + folder + '/static')) fs.mkdirSync('bundles/' + folder + '/static', { recursive: true });
                  fs.copyFileSync('src/' + folder + '/icon.png', 'bundles/' + folder + '/static/icon.png');
                }
              }
            }
            const v = JSON.parse(fs.readFileSync('bundles/versioning.json', 'utf8'));
            if (v.repository) {
              v.repository.name = 'BuscaMangá';
              v.repository.author = 'matheusparnaiba';
              v.repository.website = 'https://github.com/matheusparnaiba';
            }
            v.sources = v.sources.map(s => {
              s.author = (s.developers && s.developers[0]) ? s.developers[0].name : 'matheusparnaiba';
              s.desc = s.description || '';
              s.website = (s.developers && s.developers[0]) ? s.developers[0].github : 'https://github.com/matheusparnaiba';
              return s;
            });
            fs.writeFileSync('bundles/versioning.json', JSON.stringify(v, null, 2));
          "
      - name: Prepare Root Deployment
        run: |
          mkdir -p deploy_root/${{ github.ref_name }}
          touch deploy_root/.nojekyll
          cp -r bundles/* deploy_root/${{ github.ref_name }}/
          cp root-index.html deploy_root/index.html
          cp -r assets deploy_root/assets
          mkdir -p deploy_root/0.8/stable
          cp bundles/index.html deploy_root/0.8/stable/index.html
          cp bundles/logo.png deploy_root/0.8/stable/logo.png
          cp bundles/buscamanga.ico deploy_root/0.8/stable/buscamanga.ico
          if [ -f "bundles/tests.json" ]; then cp bundles/tests.json deploy_root/0.8/stable/tests.json; fi
          for ext in Hipertoon MangaLivre MangaLivreBlog MangaOnline MangasBrasuka; do
            if [ -d "bundles/$ext" ]; then
              cp -r "bundles/$ext" deploy_root/0.8/stable/
              if [ -f "deploy_root/0.8/stable/$ext/index.js" ]; then
                cp "deploy_root/0.8/stable/$ext/index.js" "deploy_root/0.8/stable/$ext/source.js"
                node -e "const fs=require('fs');const p='deploy_root/0.8/stable/'+'$ext'+'/source.js';let code=fs.readFileSync(p,'utf8');const extId='$ext';const wrap='\n;(function(){var mod=typeof source!==\"undefined\"?source:{};var cls=mod.'+extId+'Extension||mod.BuscaMangaExtension||mod.HipertoonExtension||mod.MangaLivreExtension||mod.MangaLivreBlogExtension||mod.MangasBrasukaExtension||Object.values(mod).find(v=>typeof v===\"function\");if(cls){globalThis.Sources=globalThis.Sources||{};globalThis.Sources['+JSON.stringify(extId)+']=cls;if(typeof this!==\"undefined\")this.Sources=globalThis.Sources;if(typeof module!==\"undefined\"&&module.exports)module.exports.Sources=globalThis.Sources;}})();\n';fs.writeFileSync(p,code+wrap);"
              fi
              if [ -f "deploy_root/0.8/stable/$ext/icon.png" ]; then
                mkdir -p "deploy_root/0.8/stable/$ext/includes"
                cp "deploy_root/0.8/stable/$ext/icon.png" "deploy_root/0.8/stable/$ext/includes/icon.png"
              fi
            fi
          done
          node -e "
            const fs = require('fs');
            const v = JSON.parse(fs.readFileSync('bundles/versioning.json', 'utf8'));
            if (v.repository) {
              v.repository.author = 'matheusparnaiba';
              v.repository.website = 'https://github.com/matheusparnaiba/buscamanga-extension';
            }
            const compatible = ['Hipertoon', 'MangaLivre', 'MangaLivreBlog', 'MangaOnline', 'MangasBrasuka'];
            v.sources = v.sources
              .filter(s => compatible.includes(s.id) || compatible.includes(s.name))
              .map(s => {
                s.author = (s.developers && s.developers[0] && s.developers[0].name) ? s.developers[0].name : 'matheusparnaiba';
                s.desc = s.desc || s.description || '';
                s.website = (s.developers && s.developers[0] && s.developers[0].github) ? s.developers[0].github : 'https://github.com/matheusparnaiba/buscamanga-extension';
                s.tags = Array.isArray(s.tags) ? s.tags : [];
                s.intents = 21;
                const urlMatch = (s.description || '').match(/https?:\/\/[^\s\"]+/);
                s.websiteBaseURL = s.websiteBaseURL || (urlMatch ? urlMatch[0] : '');
                return s;
              });
            fs.writeFileSync('deploy_root/0.8/stable/versioning.json', JSON.stringify(v, null, 2));
          "
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: deploy_root
          destination_dir: .
          keep_files: false
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
